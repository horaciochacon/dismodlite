# Perfil de columnas de dl_consolidar(): declara la forma de las tablas de tablas/ (una por medida).
#   perfil     identificador del perfil (queda en el manifiesto del consolidado)
#   archivos   una tabla por medida; {measure_slug} es el nombre de la medida en inglés (prevalence, incidence, yld)
#   medidas    medidas que se escriben
#   metrics    métricas: 1 = número de casos, 2 = porcentaje (proporción), 3 = tasa por 100 000
#   columnas   columna de salida, columna de origen en la tabla canónica y formato opcional (texto o decimales)
perfil: perfil_v1
descripcion: >-
  una tabla larga por medida con columnas en español y los nombres de medida, métrica y edad del
  catálogo; tasas y conteos
archivos: {por: measure, nombre: "{measure_slug}.csv"}
medidas: [prevalence, incidence, yld]
metrics: [2, 3, 1]
columnas:
  - {salida: causa_gbd_id, origen: cause_id}
  - {salida: causa_gbd,    origen: cause_name_es}
  - {salida: anio,         origen: year}
  - {salida: ubigeo,       origen: location_id, formato: texto}
  - {salida: departamento, origen: location_name}
  - {salida: nivel,        origen: location_level}
  - {salida: edad_id,      origen: age_group_id}
  - {salida: edad,         origen: age_group_name}
  - {salida: sexo_id,      origen: sex_id}
  - {salida: medida,       origen: measure_name}
  - {salida: metrica,      origen: metric_name}
  - {salida: valor,        origen: val,   formato: {decimales: 8}}
  - {salida: inferior,     origen: lower, formato: {decimales: 8}}
  - {salida: superior,     origen: upper, formato: {decimales: 8}}
  - {salida: run_origen,   origen: run_fuente}

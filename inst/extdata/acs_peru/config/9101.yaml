# ACS de miembros inferiores (causa 9101): configuración de ejemplo con datos sintéticos.
# Las claves que no aparecen toman su valor por defecto: ver ?dl_configuracion y print(dl_proyecto(...)).
causa: 9101
nombre: ACS de miembros inferiores
anio: 2023
edad_inicio: 30

mortalidad_exceso:
  techo: 0.20                  # por persona-año

subnacional:
  anio_validacion: 2019          # año de los datos subnacionales reservados para validar

proxies:                         # la calibración de proxies_crudos.csv (?dl_calibrar_proxies)
  transformacion:
    haqi: diferencia             # un índice de 0 a 100: en puntos; el SEV y el LDI, en cociente

sensibilidad:
  peso: [0.1, 0.5, 1.0]

notas:
  - Datos sintéticos de ejemplo (dismodlite).

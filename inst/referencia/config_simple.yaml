# Claves de la configuración simple de dismodlite (config.yaml o config/<causa>.yaml de un proyecto), una entrada por
# clave y en el orden en que se documentan. Es su única definición: de aquí salen la revisión de sus valores, la
# traducción al formato completo (valor por defecto y destino), los nombres que citan los mensajes, lo que print() y
# el manifiesto informan como tomado por defecto, la configuración comentada de dl_nuevo_proyecto() y la tabla de
# ?dl_configuracion.
#
# Campos de cada clave (los que no se dan están vacíos):
#   clave        nombre en el YAML: ancla.peso es la clave `peso` del bloque `ancla`; a[].b, la clave `b` de
#                cada registro de la lista `a`
#   tipo         entero, número, texto, lógico (true o false), sí o no (también true o false), lista de números, lista
#                de enteros, lista de textos, lista de registros o bloque: la revisión comprueba que el valor lo sea
#   destino      dónde queda el valor en el formato completo: la clave de la configuración (la que citan los errores
#                del validador completo) o, si no es una clave, el lugar; vacío si se deriva
#   descripcion  qué es, en qué unidades y qué valores admite
#   defecto      el valor por defecto en palabras: «obligatoria», una regla o el nombre de otra clave; vacío si su
#                ausencia es «ninguno» o si el valor por defecto es `valor`
#   valor        el valor por defecto cuando es fijo, en YAML
#   simbolo      símbolo del parámetro en el modelo
#   ejemplo      un valor de ejemplo, en YAML
#   vocabulario  los valores admitidos: una lista, o valor admitido -> su valor en el formato completo
#   largo        los largos admitidos de una lista
#   unico        true si el valor no se repite entre los registros de la lista
#   error        qué debe ser el valor, en palabras del formato simple, cuando el mensaje de la revisión o del
#                validador completo no sirve (porque la forma del valor es otra)
#
# `alias`: otros nombres admitidos de una clave (el nombre anterior -> el actual). `sugerencias`: la clave simple que
# se sugiere cuando la configuración trae una clave del formato completo (anchor -> ancla). `movidas`: claves que
# cambiaron de lugar (la ruta anterior -> la actual); el mensaje de la clave desconocida dice dónde está ahora.
# `tablas` y `rutas`: con un proyecto simple, los mensajes de dl_insumos() y dl_correr() nombran la tabla del proyecto de
# donde sale cada tabla del formato completo y cada argumento de dl_rutas() (y las claves simples en lugar de su destino; ver
# .dl_texto_simple()).

claves:
  - clave: causa
    tipo: entero
    destino: cause_id
    defecto: obligatoria
    ejemplo: "1234"
    descripcion: "Identificador de la causa: un entero (el cause_id de GBD si la causa existe en GBD)."

  - clave: nombre
    tipo: texto
    defecto: el cause_name de la descarga del ancla
    ejemplo: Enfermedad de ejemplo
    descripcion: >-
      Nombre de la causa que muestra print() del proyecto y que llevan las etiquetas en español del proyecto; las
      tablas de la corrida y su manifiesto llevan el cause_name del ancla.

  - clave: anio
    tipo: entero
    destino: years.ajuste
    defecto: obligatoria
    ejemplo: "2023"
    descripcion: Año que se estima.

  - clave: sexos
    tipo: lista de textos
    destino: sexos
    valor: [hombres, mujeres]
    vocabulario: [hombres, mujeres, "1", "2"]
    ejemplo: "[mujeres]"
    descripcion: >-
      Sexos que se estiman: hombres y mujeres (o sus códigos 1 y 2); una causa de un solo sexo lleva solo ese.

  - clave: edad_inicio
    tipo: número
    destino: edad_inicio
    defecto: obligatoria
    ejemplo: "30"
    descripcion: >-
      Primera edad del modelo, en años; ahí la prevalencia es 0. Una causa con `suma_de_subtipos: sí` no la necesita.

  - clave: ubicacion_gbd
    tipo: entero
    destino: ""
    defecto: el código nacional de ubicaciones.csv, si es un location_id de las descargas; o la única ubicación
    ejemplo: "130"
    descripcion: >-
      location_id de GBD del país: el de las filas nacionales de las descargas de GBD Results y del GHDx. Hace falta
      solo si las descargas traen varias ubicaciones y el código nacional de ubicaciones.csv no es su location_id.

  - clave: ancla.peso
    tipo: número
    destino: anchor.lambda
    valor: 1
    simbolo: λ
    ejemplo: "0.5"
    descripcion: >-
      Peso de la estimación de referencia, en (0, 1]: 1 la toma a peso completo; menos (por ejemplo 0.5) si los
      datos locales que entran al ajuste ya informaron esa estimación.

  - clave: ancla.correlacion_edad
    tipo: número
    destino: anchor.rho_edad
    valor: 0.5
    simbolo: ρ
    ejemplo: "0.8"
    descripcion: Correlación entre las bandas de edad vecinas del ancla, en [0, 1).

  - clave: ancla.anio
    tipo: entero
    destino: years.ancla
    defecto: anio
    ejemplo: "2023"
    descripcion: >-
      Año de la estimación de referencia cuando no es `anio`: a lo sumo un año antes, para proyectar el último año
      publicado (por ejemplo 2023 con anio 2024). Si el proyecto se lee para un año anterior al declarado
      (`dl_proyecto(anio = )`), el ancla es la de ese año: la misma configuración sirve para los años anteriores.
      Sin esta clave, si la tabla ancla no trae la
      prevalencia de la causa en `anio`, se proyecta desde el último año anterior que trae, con un mensaje.

  - clave: ancla.error_maximo
    tipo: número
    destino: anchor.gate_err_mediano
    defecto: "0.05"
    ejemplo: "0.08"
    descripcion: >-
      Error relativo mediano máximo, en (0, 1), entre la prevalencia ajustada y la del ancla con que se escribe la
      corrida: la compuerta del ancla, que ni `rapido` ni `forzar` saltan. Se sube solo con una razón (los datos
      locales son mejores que el ancla, el ancla tiene pocas bandas de edad; anótala en `notas`): la corrida declara
      el umbral entre sus limitaciones.
    error: debe ser un número en (0, 1) (sin la clave, 0.05)

  - clave: nudos
    tipo: lista de números
    destino: nudos_incidencia
    defecto: cada 10 años desde edad_inicio hasta 80, y 95
    ejemplo: "[30, 40, 50, 60, 70, 80, 95]"
    descripcion: >-
      Edades de los nudos, crecientes: las de la incidencia y las de la mortalidad en exceso (las mismas para las
      dos); log i y log f son lineales entre nudos.

  - clave: incidencia.suavidad
    tipo: número
    destino: sigma_suavidad
    valor: 0.5
    simbolo: σ
    ejemplo: "1"
    descripcion: >-
      Suavidad de la incidencia, un número > 0: la desviación estándar de las segundas diferencias de log i entre
      nudos. Un valor mayor permite una curva menos suave.

  - clave: mortalidad_exceso.prior
    tipo: texto
    destino: emr_prior.tipo
    valor: desde_ancla
    vocabulario: {desde_ancla: informativo_edad, plano: plano_cota, cero: cero}
    ejemplo: plano
    descripcion: >-
      Prior de la mortalidad en exceso (EMR): desde_ancla (por edad, de las muertes y la prevalencia del ancla),
      plano (sin prior por edad, solo el techo) o cero (la EMR queda fija en 0 y no se estima: para una causa sin
      muertes; no usa la mortalidad del ancla ni admite mortalidad_exceso.techo, mortalidad_exceso.fraccion_aguda,
      sensibilidad.fraccion_aguda ni mortalidad en datos_en_ajuste).

  - clave: mortalidad_exceso.techo
    tipo: número
    destino: emr_prior.cota
    defecto: 3 veces la EMR máxima del ancla
    ejemplo: "0.25"
    descripcion: Techo de la EMR, un número > 0, por persona-año.
    error: debe ser un número > 0, por persona-año (sin la clave, 3 veces la EMR máxima del ancla)

  - clave: mortalidad_exceso.fraccion_aguda
    tipo: número
    destino: emr_prior.fraccion_aguda
    ejemplo: "0.3"
    descripcion: >-
      Fracción de las muertes de la causa que ocurre en su fase aguda, en [0, 1): GBD reparte las muertes de algunas
      causas entre una fase aguda (los primeros 28 días, con su propio modelo) y la crónica, que es la que modela
      dismodlite, con una razón que no publica. Esa fracción se descuenta del csmr del ancla en el prior y el techo
      de la EMR; sin la clave no se descuenta nada. Anota en `notas` de dónde sale.
    error: debe ser un número en [0, 1) (sin la clave, no se descuenta nada del csmr)

  - clave: remision
    tipo: número
    destino: remision.valor
    valor: 0
    ejemplo: "0.1"
    descripcion: Remisión, un número >= 0, por persona-año (0 es una causa crónica).

  - clave: datos_en_ajuste
    tipo: lista de textos
    destino: medidas_entrada
    defecto: "ninguno: las nacionales no se usan; las subnacionales de mortalidad validan"
    vocabulario: {prevalencia: prev_estudio, prevalencia_estudio: prev_estudio, incidencia: incidencia, mortalidad: csmr}
    ejemplo: "[prevalencia, mortalidad]"
    descripcion: >-
      Tipos de la tabla datos cuyas filas nacionales entran al ajuste: prevalencia (de estudios; también se
      admite prevalencia_estudio), incidencia, mortalidad.

  - clave: severidad.particion
    tipo: texto
    destino: severidad.run_id
    ejemplo: particion/mi_corrida
    descripcion: >-
      Carpeta de una corrida de partición de severidad, relativa a la carpeta del proyecto (sin carpeta, al directorio
      de trabajo). La tabla severidad de la causa sale de ella (con los pesos de discapacidad de GBD) en vez de la
      tabla severidad. En una hija o un componente, sus límites pueden pasar de 1 (los de la partición divididos por
      su cuota): se aceptan con un aviso. La corrida copia esta carpeta en inputs/contrato/particion/<corrida>/.

  - clave: severidad.padre
    tipo: entero
    destino: severidad.padre
    ejemplo: "1010"
    descripcion: >-
      Causa padre cuya partición reparte las secuelas de esta causa (la causa es una hija dentro de la partición del
      padre). Solo con severidad.particion.

  - clave: componente.secuelas
    tipo: lista de enteros
    destino: anchor.componente.sequela_ids
    ejemplo: "[5001, 5002]"
    descripcion: >-
      Secuelas que forman el componente que se modela: el ancla se escala a su fracción de prevalencia y la severidad
      es la del componente. Necesita severidad.particion.

  - clave: subnacional.modo
    tipo: texto
    destino: cascada.modo
    defecto: >-
      covariables si alguna covariable de la tabla betas tiene filas subnacionales en la tabla covariables; si no, plano
      si la población trae otras ubicaciones; si no, no
    vocabulario: [covariables, plano, razon, "no"]
    ejemplo: plano
    descripcion: >-
      Estimación subnacional: covariables (gradiente por las covariables de la tabla betas), plano (las tasas nacionales en cada
      ubicación), razon (las tasas nacionales por la razón de cada ubicación, de la tabla razones, con cierre en el
      nacional) o no (sin estimación subnacional).

  - clave: subnacional.kappa
    tipo: número
    destino: cascada.kappa
    valor: 1
    simbolo: κ
    ejemplo: "0.5"
    descripcion: Fuerza del efecto subnacional de las covariables, en (0, 1].

  - clave: subnacional.anio_validacion
    tipo: entero
    destino: cascada.heldout_anio
    defecto: anio
    ejemplo: "2019"
    descripcion: Año de los datos subnacionales de datos.csv reservados para validar.

  - clave: proxies.metodo
    tipo: texto
    destino: ""
    valor: paseo_aleatorio
    vocabulario: [paseo_aleatorio, edicion]
    ejemplo: edicion
    descripcion: >-
      Cómo se obtiene el gradiente subnacional del año que se estima desde proxies_crudos: paseo_aleatorio suaviza
      todas las ediciones (q por máxima verosimilitud; ver ?dl_calibrar_proxies); edicion usa la del año o la más
      cercana.

  - clave: proxies.transformacion
    tipo: bloque
    destino: ""
    ejemplo: "{haqi: diferencia}"
    descripcion: >-
      Por covariable: cociente (tasas y proporciones; por defecto) o diferencia (índices). Cada clave es una
      covariable de proxies_crudos.

  - clave: proxies.excluir
    tipo: lista de registros
    destino: ""
    ejemplo: "[{anio: 2021, motivo: cambio de modo de la encuesta}]"
    descripcion: Ediciones de proxies_crudos que no entran, cada una con anio y motivo.

  - clave: sensibilidad.peso
    tipo: lista de números
    destino: sensibilidad.lambda
    valor: [0.25, 0.5, 1]
    simbolo: λ
    ejemplo: "[0.5, 1]"
    descripcion: Valores de ancla.peso del análisis de sensibilidad.

  - clave: sensibilidad.correlacion_edad
    tipo: lista de números
    destino: sensibilidad.rho
    valor: [0, 0.5, 0.9]
    simbolo: ρ
    ejemplo: "[0, 0.9]"
    descripcion: Valores de ancla.correlacion_edad del análisis de sensibilidad.

  - clave: sensibilidad.kappa
    tipo: lista de números
    destino: sensibilidad.kappa
    valor: [0.5, 1]
    simbolo: κ
    ejemplo: "[1]"
    descripcion: Valores de subnacional.kappa del análisis de sensibilidad.

  - clave: sensibilidad.fraccion_aguda
    tipo: lista de números
    destino: sensibilidad.fraccion_aguda
    ejemplo: "[0, 0.3, 0.5]"
    descripcion: >-
      Valores de mortalidad_exceso.fraccion_aguda del análisis de sensibilidad, cada uno en [0, 1); sin la clave, la
      sensibilidad no varía la fracción aguda.

  - clave: subtipos
    tipo: lista de enteros
    ejemplo: "[1011, 1012, 1013]"
    descripcion: >-
      Causas hijas cuya suma es esta causa (solo en la configuración de la causa padre): cada una tiene su
      configuración (en el mismo proyecto, config/<causa>.yaml, que la reconoce como subtipo: sin betas propias, usa
      las de esta causa; o en su propia carpeta, con `subtipo_de`). Un subtipo tiene una sola causa padre. Con
      `suma_de_subtipos: sí`, dl_correr() suma sus corridas (ver ?dl_proyecto).

  - clave: suma_de_subtipos
    tipo: sí o no
    defecto: "no"
    ejemplo: sí
    descripcion: >-
      Con sí, la causa no se ajusta: es la suma, simulación a simulación, de las corridas de sus `subtipos`, y
      dl_correr() la suma. Exige `subtipos` y `nombre`. El proyecto de una suma solo usa las tablas ubicaciones y
      poblacion y las claves causa, nombre, anio, sexos, ubicacion_gbd, subtipos, subtipos_omitidos y notas: no
      necesita edad_inicio, ancla, severidad ni betas.
    error: debe ser sí o no

  - clave: "subtipos_omitidos[].causa"
    tipo: entero
    destino: "suma.omitidas[].cause_id"
    defecto: obligatoria
    unico: true
    ejemplo: "1013"
    descripcion: >-
      Un subtipo de `subtipos` que no se modela y no entra en la suma (solo con `suma_de_subtipos: sí`): la suma
      queda por debajo de la causa en su parte y la corrida lo declara.

  - clave: "subtipos_omitidos[].motivo"
    tipo: texto
    destino: "suma.omitidas[].motivo"
    defecto: obligatoria
    ejemplo: sin datos suficientes
    descripcion: Por qué el subtipo no entra en la suma; queda entre las limitaciones de la corrida.

  - clave: subtipo_de
    tipo: entero
    destino: extraction.cause_id
    ejemplo: "1010"
    descripcion: >-
      Causa padre de esta causa, para un subtipo que se lee en su propia carpeta, sin la configuración de su padre: si
      la tabla betas no trae filas de la causa, usa las de la causa padre, y la corrida declara a la causa padre, que
      la suma exige (dl_correr() de una causa con `suma_de_subtipos`, o dl_sumar_hijas()). Si la configuración del
      padre la declara en `subtipos`, la relación sale sola y las dos deben decir la misma causa (ver ?dl_proyecto).
    error: debe ser un entero positivo, el cause_id de la causa padre (distinto de la propia causa)

  - clave: notas
    tipo: lista de textos
    destino: decisiones
    ejemplo: "[la encuesta nacional ya entró a la estimación de referencia]"
    descripcion: Decisiones que quedan registradas en cada corrida.

  - clave: avanzado
    tipo: bloque
    ejemplo: "{nsub: 10}"
    descripcion: "Claves del formato completo, tal cual: se aplican al final, sobre la traducción (para expertos)."

alias:
  departamentos: subnacional

sugerencias:
  cause_id: causa
  years: anio
  anchor: ancla
  nudos_incidencia: nudos
  sigma_suavidad: incidencia
  emr_prior: mortalidad_exceso
  medidas_entrada: datos_en_ajuste
  cascada: subnacional
  decisiones: notas

movidas:
  incidencia.nudos: nudos
  ubicacion_nacional: ubicacion_gbd

tablas:
  prior_gbd: ancla
  datos: datos
  cov_proxy: covariables
  poblacion: poblacion
  severidad: severidad
  cov_valores: covariables
  betas: betas

rutas:
  ancla_prevalencia: la prevalencia de la tabla ancla
  ancla_mortalidad: la mortalidad de la tabla ancla
  ancla_incidencia: la incidencia de la tabla ancla
  ancla_avd: los AVD de la tabla ancla
  poblacion: la tabla poblacion
  datos: la tabla datos
  proxies: la tabla covariables
  severidad: la tabla severidad
  pesos_80mas: los pesos de 80 años y más (de la tabla poblacion)
  covariables: la tabla covariables

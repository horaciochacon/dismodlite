# Sitio del paquete con pkgdown (_pkgdown.yml): se construye en cada cambio y se publica en GitHub Pages desde main
# (en la configuración del repositorio, Pages tiene como fuente «GitHub Actions»). En una solicitud de cambios solo
# se construye, sin correr los ejemplos de la ayuda (las guías sí corren), y cada construcción nueva cancela la
# anterior. Antes corren, desde el código fuente, las pruebas que leen R/, man/ y las guías (test-fuente-*.R): aquí
# cubren también los cambios que solo tocan la documentación del sitio, que R-CMD-check ignora.
# Basado en los ejemplos de r-lib/actions (v2).
name: pkgdown

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  construir:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      # Quarto renderiza las guías del sitio (vignettes/*.qmd y vignettes/articles/*.qmd).
      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Instala también pandoc (el paquete sugiere rmarkdown).
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Pruebas desde el código fuente (test-fuente-*.R)
        shell: Rscript {0}
        run: testthat::test_local(filter = "fuente", stop_on_failure = TRUE)

      # Se construye aunque fallen esas pruebas (para ver también si las guías corren), pero entonces no se publica.
      - name: Construir el sitio
        if: ${{ !cancelled() }}
        shell: Rscript {0}
        run: |
          pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE,
                                           examples = "${{ github.event_name }}" != "pull_request")

      - name: Subir el sitio
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publicar:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - id: publicar
        uses: actions/deploy-pages@v4

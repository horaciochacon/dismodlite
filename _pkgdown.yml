url: https://horaciochacon.github.io/dismodlite/
lang: es

template:
  bootstrap: 5

home:
  title: "dismodlite: carga de enfermedad por edad, sexo y ubicación subnacional"
  description: >
    Estima prevalencia, incidencia, mortalidad en exceso y años vividos con discapacidad por edad y sexo con un
    modelo enfermedad-muerte anclado en una estimación de referencia, y los desagrega a las ubicaciones
    subnacionales de un país.


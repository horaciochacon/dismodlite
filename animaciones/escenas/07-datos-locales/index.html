<!doctype html>
<html lang="es">
<head>

<title>07 · Los datos locales · dismodlite</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

<body>
<script>
// Escena 07: los datos locales. Guion: guion.md. Datos: datos/r/07-datos-locales.R (dl_ajustar() sin y con datos).
(function () {
  'use strict';
  var D = DL.dib, M = DL.mov, P = D.paleta, E = M.EASE;
  var datos = DL_DATOS['07-datos-locales'];
  var edades = datos.edades;
  var k80 = edades.indexOf(80);

  // ---- Narración: cada línea dura al menos 0,3 s por palabra + 0,5 s ----
  var NARRACION = [
    [0.4, 5.3, 'La tabla datos del ejemplo trae ' + datos.n_nacionales + ' filas nacionales de 2023, de tres medidas.'],
    [5.6, 11.6, 'Por defecto, datos_en_ajuste está vacío: el ajuste usa solo el ancla y los priors.'],
    [11.9, 17.1, 'Al listar medidas, entran las filas nacionales del año, de esas medidas y sin excluir.'],
    [17.4, 21.1, 'Las covariables no entran aquí: solo mueven las estimaciones subnacionales.'],
    [21.4, 26.2, 'Cada dato se compara con el modelo promediado en su intervalo de edad: $q_d$.'],
    [26.5, 31.1, '$p$ para la prevalencia, $i(1-p)$ para la incidencia y $p\\,f$ para la mortalidad.'],
    [31.4, 35.3, 'Un dato con valor y error estándar entra con una log-normal.'],
    [35.6, 39.8, 'Su $\\ell_d$: el logaritmo de la densidad normal de $\\log x$ en $\\log q_d$.'],
    [40.1, 45.4, 'Con casos y muestra: binomial para la prevalencia, Poisson para la incidencia y la mortalidad.'],
    [45.7, 50.6, 'El estudio de 80 años y más: 70 casos entre 800, frente a $q_d$.'],
    [50.9, 55.7, '$L_{datos}$ suma los $\\ell_d$; se omiten $\\log\\binom{n}{x}$ y $-\\log x!$, que no dependen de $\\theta$.'],
    [56.0, 60.3, 'Si estos datos ya informaron la estimación de referencia, contarían dos veces.'],
    [60.6, 65.8, 'Por eso se baja el peso del ancla: con $\\lambda = 0.5$ cuenta como la mitad.'],
    [66.4, 70.9, 'Sin datos en el ajuste, la prevalencia de los hombres sigue al ancla.'],
    [71.2, 76.6, 'Con los datos, aun con $\\lambda = 0.5$, baja hacia el estudio y el intervalo se estrecha.'],
    [76.9, 84.5, null],   // la frase final se arma con los anchos del intervalo (abajo)
  ];

  // ---- Tomas: cada una sale entera en 0,24 s ----
  var TOMA = { filas: [0, 21.1], q: [21.4, 31.1], verosimilitud: [31.4, 55.7], lambda: [55.8, 65.9], payoff: [66.2, Infinity] };
  function enToma(t, nombre, t0) {
    var r = TOMA[nombre];
    // La primera toma ya está en el cuadro 0 (composición terminada): entra sin fundido.
    return M.visible(t, t0 === undefined ? r[0] : t0, r[1], { entrada: r[0] === 0 && t0 === undefined ? 0 : undefined });
  }

  // ---- Utilidades ----
  function porMil(x, dig) { return D.num(1000 * x, dig === undefined ? 2 : dig); }
  function pct(x, dig) { return D.num(100 * x, dig === undefined ? 2 : dig); }
  function signo(x, dig) { return (x < 0 ? '−' : '') + D.num(Math.abs(x), dig); }
  function edadTxt(a0, a1) { return a1 >= 125 ? a0 + '+' : a0 + '–' + a1; }
  // Tarjeta: superficie blanca con borde de rejilla.
  function tarjeta(x, y, w, h, o) { return D.rect(x, y, w, h, { relleno: P.superficie, borde: P.rejilla, grosor: 2, radio: 12, o: o }); }

  // ---- Las fórmulas (notación de la guía «El modelo», sección 5) ----
  var F_LOGNORMAL = '\\ell_d = \\log N\\big(\\log(q_d + \\eta);\\ \\log(val_d + \\eta),\\ s_{log,d}\\big)';
  var F_SLOG = 's_{log,d} = se_d / (val_d + \\eta)';
  var F_BINOMIAL = '\\ell_d = x \\log q_d + (n - x) \\log(1 - q_d)';
  var F_POISSON = '\\ell_d = x \\log(n\\, q_d) - n\\, q_d';
  var F_SUMA = 'L_{datos} = \\sum_d \\ell_d';
  var F_ANCLA = 'L_{ancla} = \\log MVN(z;\\ 0,\\ \\Sigma / \\htmlClass{lam}{\\lambda})';
  var F_POSTERIOR = '\\log \\text{posterior}(\\theta) = L_{suavidad} + L_{emr} + \\htmlClass{lam}{L_{ancla}} + L_{datos} \\; (+\\ \\text{constantes})';
  var ESTILO_LAMBDA = { lam: 'text-decoration:underline 4px ' + P.marca + ';text-underline-offset:7px;text-decoration-skip-ink:none;' };

  // =====================================================================================================
  // Toma 1: qué filas entran
  // =====================================================================================================
  var MEDIDAS = [
    { medida: 'mortalidad', nombre: 'mortalidad', forma: 'valor y error estándar' },
    { medida: 'incidencia', nombre: 'incidencia', forma: 'valor y error estándar' },
    { medida: 'prevalencia', nombre: 'prevalencia', forma: 'casos y muestra' },
  ];
  var REJ = { x: 800, xSexo: 1060, xCajas: 1180, y: 300, cajaW: 84, cajaH: 44, paso: 92, fila: 54, grupo: 126 };
  // Las cajas, en el orden de la tabla: medida, sexo, edad.
  var CAJAS = [];
  MEDIDAS.forEach(function (m, g) {
    ['hombres', 'mujeres'].forEach(function (sx, s) {
      var filas = datos.filas.filter(function (f) { return f.medida === m.medida && f.sexo === sx; })
        .sort(function (a, b) { return a.inicio - b.inicio; });
      filas.forEach(function (f, k) {
        CAJAS.push({ f: f, x: REJ.xCajas + k * REJ.paso, y: REJ.y + g * REJ.grupo + s * REJ.fila });
      });
    });
  });
  var ENTRAN = CAJAS.filter(function (c) { return !c.f.excluir; });
  var EXCLUIDA = CAJAS.filter(function (c) { return c.f.excluir; })[0];

  function yaml(t, o) {
    var s = [];
    var x = 96, y = 268, w = 600;
    // El recuadro de la marca: entra en 5.8 s alrededor de la clave y se estira con la lista en 12.2 s.
    var oMarca = M.entra(t, 5.8, 0.4, E.entrarSuave);
    var alto = 50 + 132 * M.entra(t, 12.2, 0.5, E.mover);
    s.push(tarjeta(x, y, w, 300, o));
    if (oMarca > 0) s.push(D.rect(x + 14, y + 104, w - 28, alto, { borde: P.marca, grosor: 3, radio: 8, o: oMarca * o }));
    var mono = { fuente: 'mono', tam: 26 };
    s.push(D.texto(x + 30, y + 48, '# config/9100.yaml', { fuente: 'mono', tam: 24, color: P.suave, o: o, id: 'yaml-archivo' }));
    s.push(D.texto(x + 30, y + 92, 'anio: 2023', Object.assign({ o: o, id: 'yaml-anio' }, mono)));
    var oVacio = Math.min(o, M.visible(t, 0, 12.0, { entrada: 0 }));
    s.push(D.texto(x + 30, y + 138, 'datos_en_ajuste: []  # por defecto', Object.assign({ o: oVacio, id: 'yaml-vacio' }, mono)));
    var oClave = Math.min(o, M.visible(t, 12.2, Infinity));
    s.push(D.texto(x + 30, y + 138, 'datos_en_ajuste:', Object.assign({ o: oClave, id: 'yaml-clave' }, mono)));
    ['prevalencia', 'incidencia', 'mortalidad'].forEach(function (m, k) {
      var ok = Math.min(o, M.visible(t, 12.3 + 0.12 * (k + 1), Infinity));
      s.push(D.texto(x + 30, y + 182 + 44 * k, '\u00a0\u00a0- ' + m, Object.assign({ o: ok, id: 'yaml-' + m }, mono)));
    });
    return s.join('');
  }

  function rejilla(t, o, c) {
    var s = [];
    s.push(D.texto(REJ.x, REJ.y - 20, 'datos.csv · filas nacionales (Perú), 2023', { tam: 26, color: P.suave, o: o, id: 'rej-titulo' }));
    MEDIDAS.forEach(function (m, g) {
      var y = REJ.y + g * REJ.grupo;
      s.push(D.texto(REJ.x, y + 30, m.nombre, { tam: 28, peso: 600, o: o, id: 'rej-' + m.medida }));
      s.push(D.texto(REJ.x, y + 62, m.forma, { tam: 22, color: P.suave, o: o, id: 'rej-forma-' + m.medida }));
      s.push(D.texto(REJ.xSexo, y + 29, 'hombres', { tam: 22, color: P.suave, o: o }));
      s.push(D.texto(REJ.xSexo, y + REJ.fila + 29, 'mujeres', { tam: 22, color: P.suave, o: o }));
    });
    var llenas = 0;
    ENTRAN.forEach(function (cj, k) {
      var u = M.entra(t, 13.0 + 0.06 * k, 0.3, E.entrarSuave);
      if (u >= 0.5) llenas++;
      s.push(D.rect(cj.x, cj.y, REJ.cajaW, REJ.cajaH, { relleno: P.superficie, borde: P.suave, grosor: 2, radio: 6, o: o }));
      if (u > 0) s.push(D.rect(cj.x, cj.y, REJ.cajaW, REJ.cajaH, { relleno: P.tinta, radio: 6, o: u * o }));
      s.push(D.texto(cj.x + REJ.cajaW / 2, cj.y + 30, edadTxt(cj.f.inicio, cj.f.fin), { fuente: 'mono', tam: 22, ancla: 'middle', color: u >= 0.5 ? P.superficie : P.tinta, o: o }));
    });
    // El dato excluido: contorno punteado; se tacha cuando la lista ya entró.
    var ex = EXCLUIDA;
    s.push(D.rect(ex.x, ex.y, REJ.cajaW, REJ.cajaH, { relleno: P.superficie, borde: P.suave, grosor: 2, radio: 6, guiones: t >= 14.7 ? '5 4' : null, o: o }));
    s.push(D.texto(ex.x + REJ.cajaW / 2, ex.y + 30, edadTxt(ex.f.inicio, ex.f.fin), { fuente: 'mono', tam: 22, ancla: 'middle', color: t >= 14.7 ? P.suave : P.tinta, o: o }));
    var uT = M.entra(t, 14.7, 0.3, E.mover);
    if (uT > 0) s.push(D.trazo([[ex.x + 4, ex.y + REJ.cajaH - 4], [ex.x + REJ.cajaW - 4, ex.y + 4]], { color: P.tinta, grosor: 3, progreso: uT, o: o }));
    var yNota = REJ.y + 2 * REJ.grupo + 2 * REJ.fila + 22;
    s.push(D.texto(REJ.x, yNota, edadTxt(ex.f.inicio, ex.f.fin) + ', mujeres: valor y error estándar; excluida (' + ex.f.motivo + ')',
      { tam: 22, color: P.suave, o: Math.min(o, M.visible(t, 15.0, Infinity)), id: 'nota-excluida' }));
    // Las subnacionales: fuera del ajuste nacional.
    var ySub = 716;
    s.push(D.texto(REJ.x, ySub + 36, 'subnacionales', { tam: 28, peso: 600, o: o, id: 'rej-sub' }));
    s.push(D.rect(REJ.xCajas, ySub, 636, 56, { borde: P.suave, grosor: 2, radio: 6, guiones: '5 4', o: o }));
    s.push(D.texto(REJ.xCajas + 20, ySub + 36, datos.n_subnacionales + ' filas de ' + datos.anio_subnacional + ': validan la estimación subnacional',
      { tam: 24, color: P.suave, o: o, id: 'rej-sub-texto' }));
    if (o > 0) {
      c.dato('cajas_llenas', llenas);
      c.dato('cajas_excluidas', CAJAS.length - ENTRAN.length);
      c.dato('cajas', CAJAS.length);
    }
    return s.join('');
  }

  function covariables(t, o) {
    var oc = Math.min(o, M.visible(t, 17.6, Infinity));
    if (oc <= 0) return '';
    return D.rect(96, 610, 600, 64, { borde: P.suave, grosor: 2, radio: 8, guiones: '5 4', o: oc }) +
      D.texto(122, 651, 'covariables: solo en la estimación subnacional', { tam: 26, o: oc, id: 'covariables' });
  }

  // =====================================================================================================
  // Toma 2: contra qué se compara cada dato (tres paneles, hombres)
  // =====================================================================================================
  var PANELES = [
    { medida: 'prevalencia', titulo: 'prevalencia · $q_d$ de $p$', color: P.p, curva: datos.curva_p, esc: 100, unidad: '%',
      yDom: [0, 0.16], yTicks: [0, 0.04, 0.08, 0.12, 0.16], t0: 21.6 },
    { medida: 'incidencia', titulo: 'incidencia · $q_d$ de $i(1-p)$', color: P.i, curva: datos.curva_ipop, esc: 1000, unidad: 'por 1000 personas-año',
      yDom: [0, 0.012], yTicks: [0, 0.004, 0.008, 0.012], t0: 26.8 },
    { medida: 'mortalidad', titulo: 'mortalidad · $q_d$ de $p\\,f$', color: P.f, curva: datos.curva_pf, esc: 1000, unidad: 'por 1000 personas-año',
      yDom: [0, 0.012], yTicks: [0, 0.004, 0.008, 0.012], t0: 28.0 },
  ];
  PANELES.forEach(function (pn, k) {
    pn.G = D.ejes({
      x: 186 + k * 590, y: 380, ancho: 440, alto: 330, id: 'panel-' + k,
      xDom: [50, 99], yDom: pn.yDom, xTicks: [50, 60, 70, 80, 90], yTicks: pn.yTicks,
      yFormato: function (v) { return D.num(v * pn.esc, 0); },
      yTitulo: pn.unidad, xTitulo: k === 2 ? 'Edad (años)' : undefined,
    });
    pn.datos = datos.datos.filter(function (d) { return d.medida === pn.medida; });
  });

  // Un dato en ink: segmento sobre su intervalo de edad, círculo hueco y, si trae error, bigote del 95 %.
  function marcaDato(G, d, o) {
    var a1 = Math.min(d.fin, 99), xm = G.x((d.inicio + a1) / 2);
    var s = D.linea(G.x(d.inicio), G.y(d.obs), G.x(a1), G.y(d.obs), { color: P.tinta, grosor: 2, o: o });
    if (d.inf95 !== null) s += D.linea(xm, G.y(d.inf95), xm, G.y(d.sup95), { color: P.tinta, grosor: 2, o: o });
    return s + D.circulo(xm, G.y(d.obs), 7, { relleno: P.superficie, borde: P.tinta, grosor: 3, o: o });
  }
  function marcaQ(G, d, color, u, o) {
    var a1 = Math.min(d.fin, 99);
    return D.trazo([[G.x(d.inicio), G.y(d.q)], [G.x(a1), G.y(d.q)]], { color: color, grosor: 6, progreso: u, o: o });
  }

  function panel(t, pn, k, oToma, c) {
    var s = [];
    var o = Math.min(oToma, M.entra(t, pn.t0, 0.4, E.entrarSuave));
    if (o <= 0) return '';
    c.defs(pn.G.recorte());
    s.push(D.parrafo(pn.G.izq - 70, 290, 520, pn.titulo, { tam: 28, peso: 600, o: o, id: 'panel-titulo-' + k, alto: 44 }));
    s.push(pn.G.svg({ o: o }));
    var dur = k === 0 ? 1.6 : 1.0;
    var u = M.tramo(t, pn.t0 + 0.2, pn.t0 + 0.2 + dur);   // lineal: la edad avanza a ritmo constante
    var xs = [], ys = [];
    for (var j = 0; j < edades.length; j++) {
      if (edades[j] < 50) continue;
      if (edades[j] > 50 + u * 49) break;
      xs.push(edades[j]); ys.push(pn.curva[j]);
    }
    if (xs.length > 1) s.push(pn.G.curva(xs, ys, { color: pn.color, grosor: 3, o: 0.55 * oToma }));
    var tD = pn.t0 + 0.2 + dur - 0.2;
    pn.datos.forEach(function (d, j) {
      var od = Math.min(oToma, M.entra(t, tD + 0.06 * j, 0.3, E.entrarSuave));
      if (od > 0) s.push(marcaDato(pn.G, d, od));
    });
    var tQ = tD + 0.06 * pn.datos.length + 0.3;
    pn.datos.forEach(function (d, j) {
      var uq = M.entra(t, tQ + 0.06 * j, 0.4, E.mover);
      if (uq > 0) s.push(marcaQ(pn.G, d, pn.color, uq, oToma));
    });
    if (t >= tQ) c.dato('panel_' + pn.medida + '_q', pn.datos.map(function (d) { return d.q; }));
    return s.join('');
  }

  function leyendaPaneles(t, o) {
    var ol = Math.min(o, M.visible(t, 24.6, Infinity));
    if (ol <= 0) return '';
    var y = 838, s = [];
    s.push(D.linea(186, y - 8, 226, y - 8, { color: P.tinta, grosor: 2, o: ol }));
    s.push(D.circulo(206, y - 8, 7, { relleno: P.superficie, borde: P.tinta, grosor: 3, o: ol }));
    s.push(D.texto(240, y, 'dato, sobre su intervalo de edad (bigote, si trae error: 95 % de su log-normal)', { tam: 22, color: P.suave, o: ol, id: 'ley-dato' }));
    [P.p, P.i, P.f].forEach(function (col, k) { s.push(D.linea(990 + 16 * k, y - 8, 1002 + 16 * k, y - 8, { color: col, grosor: 6, o: Math.min(ol, M.visible(t, [24.6, 27.4, 28.6][k], Infinity)), extremo: 'butt' })); });
    s.push(D.parrafo(1044, y - 24, 780, '$q_d$: el modelo promediado en el intervalo, ponderado por la población', { tam: 22, color: P.suave, o: ol, id: 'ley-q', alto: 40 }));
    s.push(D.parrafo(186, y + 14, 1640, 'Hombres; curvas y $q_d$ en la media posterior de $\\theta$ del ajuste con datos ($\\lambda = 0.5$).', { tam: 22, color: P.suave, o: Math.min(o, M.visible(t, 25.0, Infinity)), id: 'ley-theta', alto: 36 }));
    return s.join('');
  }

  // =====================================================================================================
  // Toma 3: cómo entra cada dato
  // =====================================================================================================
  var DLN = datos.datos.filter(function (d) { return d.medida === 'incidencia' && d.inicio === 70; })[0];
  var DBI = datos.datos.filter(function (d) { return d.medida === 'prevalencia' && d.fin === 125; })[0];

  // Las fórmulas de la guía, en JS, para recalcular el ℓ_d que dibuja la escena.
  function lLognormal(q, val, s, eta) {
    var z = (Math.log(q + eta) - Math.log(val + eta)) / s;
    return -0.5 * Math.log(2 * Math.PI) - Math.log(s) - 0.5 * z * z;
  }
  function lBinomial(q, x, n) { return x * Math.log(q) + (n - x) * Math.log1p(-q); }

  // La densidad de la log-normal del dato en escala log, sobre x (por 1000) en escala log.
  var GLN = D.ejes({
    x: 190, y: 590, ancho: 660, alto: 120, id: 'lognormal', xLog: true,
    xDom: [2.8, 10], yDom: [0, 2.3], xTicks: [3, 4, 5, 6, 8, 10], yTicks: [],
    xTitulo: 'incidencia de 70 a 79 años (por 1000 personas-año, escala log)',
  });
  var GBI = D.ejes({
    x: 1090, y: 590, ancho: 660, alto: 120, id: 'binomial',
    xDom: [6, 12.5], yDom: [-244, -236.5], xTicks: [6, 7, 8, 9, 10, 11, 12], yTicks: [],
    xFormato: function (v) { return v + ' %'; }, xTitulo: '$\\ell_d$ según $q_d$, prevalencia de 80 años y más (eje vertical recortado)',
  });

  function tarjetaLognormal(t, o, c) {
    var s = [];
    var oc = Math.min(o, M.entra(t, 31.6, 0.4, E.entrarSuave));
    if (oc <= 0) return '';
    s.push(tarjeta(96, 256, 840, 540, oc));
    s.push(D.texto(130, 304, 'Valor y error estándar → log-normal', { fuente: 'titulo', tam: 32, peso: 600, o: oc, id: 'tit-lognormal' }));
    s.push(D.formula(F_LOGNORMAL, 130, 362, { tam: 32, o: Math.min(o, M.visible(t, 31.9, Infinity)), id: 'f-lognormal', palabras: 6, ancho: 790, alto: 70 }));
    s.push(D.formula(F_SLOG, 130, 420, { tam: 30, o: Math.min(o, M.visible(t, 32.5, Infinity)), id: 'f-slog', palabras: 3, ancho: 400, alto: 60 }));
    s.push(D.parrafo(130, 446, 790, '$\\eta$ = 0 por defecto; solo hace falta si algún valor es 0.', { tam: 24, color: P.suave, o: Math.min(o, M.visible(t, 33.1, Infinity)), id: 'nota-eta', alto: 40 }));
    // El gráfico de la densidad.
    var og = Math.min(o, M.entra(t, 35.7, 0.4, E.entrarSuave));
    if (og > 0) {
      c.defs(GLN.recorte());
      s.push(GLN.svg({ o: og }));
      var v = 1000 * DLN.val, sl = DLN.s_log, q = 1000 * DLN.q;
      var dens = function (x) { var z = (Math.log(x) - Math.log(v)) / sl; return Math.exp(-0.5 * z * z) / (sl * Math.sqrt(2 * Math.PI)); };
      var xs = [], ys = [];
      for (var j = 0; j <= 120; j++) { var x = 2.8 * Math.pow(10 / 2.8, j / 120); xs.push(x); ys.push(dens(x)); }
      s.push(GLN.curva(xs, ys, { color: P.suave, grosor: 3, progreso: M.entra(t, 35.9, 0.8, E.mover), o: o }));
      var ov = Math.min(o, M.visible(t, 36.5, Infinity));
      s.push(D.linea(GLN.x(v), GLN.abajo, GLN.x(v), GLN.y(dens(v)), { color: P.tinta, grosor: 2, guiones: '6 5', o: ov }));

    var o2 = enToma(t, 'q');
    if (o2 > 0) {
      PANELES.forEach(function (pn, k) { c.svg(panel(t, pn, k, o2, c)); });
      c.svg(leyendaPaneles(t, o2));
    }

    // Toma 3.
    var o3 = enToma(t, 'verosimilitud');
    if (o3 > 0) c.svg(tarjetaLognormal(t, o3, c), tarjetaConteos(t, o3, c), franjaSuma(t, o3, c));

    // Toma 4 y 5.
    c.svg(tomaLambda(t, c));
    c.svg(tomaPayoff(t, c));

    c.svg(D.rotulo(t, NARRACION));
    c.svg(D.pie(datos.fuente + ' (4 cadenas; ' + datos.mcmc.sin_datos.iteraciones + ' y ' + datos.mcmc.con_datos.iteraciones + ' iteraciones, la mitad de calentamiento)'));
  }

  DL.escena({
    id: '07-datos-locales',
    titulo: 'Los datos locales',
    duracion: 84.5, fps: 30,
    marcas: {
      tabla: 3.0, vacio: 9.0, entran: 16.0, covariables: 20.0, panel_p: 25.5, paneles: 30.6,
      lognormal: 39.0, conteos: 44.0, binomial: 49.8, suma: 54.5, lambda: 64.5, sin_datos: 70.0,
      con_datos: 75.8, final: 83.5,
    },
    camaras: [],
    dibujar: dibujar,
    auditoria: function (A) {
      var dLN = DLN, dBI = DBI;
      return [
        A.en('entran', 'las cajas llenas son las filas que entran al ajuste del paquete', function (e) {
          if (e.cajas !== datos.n_nacionales) return 'dibuja ' + e.cajas + ' cajas de ' + datos.n_nacionales + ' filas';
          if (e.cajas_llenas !== datos.n_entran) return e.cajas_llenas + ' cajas llenas; entran ' + datos.n_entran;
          return e.cajas_excluidas === datos.n_excluidas || e.cajas_excluidas + ' excluidas; el paquete excluye ' + datos.n_excluidas;
        }),
        A.en('vacio', 'por defecto ninguna caja está llena (datos_en_ajuste vacío)', function (e) {
          return e.cajas_llenas === 0 || e.cajas_llenas + ' cajas llenas';
        }),
        A.en('lognormal', 'l_d log-normal (incidencia 70-79) recalculado en JS = l_d del paquete (1e-9)', function (e) {
          if (!A.cerca(e.slog_js, dLN.s_log, 1e-12)) return 's_log ' + e.slog_js + ' frente a ' + dLN.s_log;
          if (!A.cerca(e.l_lognormal_js, dLN.l, 1e-9)) return 'l_d ' + e.l_lognormal_js + ' frente a ' + dLN.l;
          return e.l_lognormal_dibujado === D.num(dLN.l, 3) || 'dibuja ' + e.l_lognormal_dibujado;
        }),
        A.en('binomial', 'l_d binomial (estudio de 80+) recalculado en JS = l_d del paquete (1e-9)', function (e) {
          if (!A.cerca(e.l_binomial_js, dBI.l, 1e-9)) return 'l_d ' + e.l_binomial_js + ' frente a ' + dBI.l;
          return e.l_binomial_dibujado === signo(dBI.l, 2) || 'dibuja ' + e.l_binomial_dibujado;
        }),
        A.en('binomial', 'todos los l_d exportados se recalculan en JS con la fórmula de la guía (1e-9)', function () {
          for (var k = 0; k < datos.datos.length; k++) {
            var d = datos.datos[k];
            var l = d.ruta === 'lognormal' ? lLognormal(d.q, d.val, d.s_log, d.eta) : lBinomial(d.q, d.x, d.n);
            if (!A.cerca(l, d.l, 1e-9)) return d.medida + ' ' + d.inicio + '-' + d.fin + ': ' + l + ' frente a ' + d.l;
          }
          return true;
        }),
        A.en('suma', 'la suma de los l_d es L_datos de .dl_lp_componentes() (1e-9)', function (e) {
          if (!A.cerca(e.L_datos_js, datos.L_componentes.datos, 1e-9)) return 'suma ' + e.L_datos_js + ' frente a ' + datos.L_componentes.datos;
          return A.cerca(datos.L_componentes.datos, datos.L_datos, 1e-12) || 'L_datos exportado distinto';
        }),
        A.en('lambda', 'el ajuste con datos usa lambda = 0.5', function (e) { return e.lambda_con_datos === 0.5 || 'lambda ' + e.lambda_con_datos; }),
        A.en('final', 'los anchos en 80 años son los de dl_estimaciones() y el de con datos es menor', function (e) {
          // Las barras dibujadas, medidas en px con la escala del eje (480 px = 24 puntos), frente al ancho del paquete.
          var pxPorPunto = 480 / 0.24;
          if (Math.abs(e.barra_sin_px - pxPorPunto * (datos.sin_datos.superior[k80] - datos.sin_datos.inferior[k80])) > 0.5) return 'barra sin datos ' + e.barra_sin_px + ' px';
          if (Math.abs(e.barra_con_px - pxPorPunto * (datos.con_datos.superior[k80] - datos.con_datos.inferior[k80])) > 0.5) return 'barra con datos ' + e.barra_con_px + ' px';
          return e.ancho_con < e.ancho_sin || 'el intervalo no se estrecha';
        }),
        A.en('final', 'la media dibujada es la del ajuste con datos y el q_d de cada estudio se acerca a su x/n', function (e) {
          if (e.morph_completo !== true) return 'el cambio no terminó';
          if (!A.cerca(e.media80_dibujada, datos.con_datos.media[k80], 1e-12)) return 'media ' + e.media80_dibujada;
          if (e.q80_dibujado !== pct(datos.estudios.con_datos[2].media, 1)) return 'q_d 80+ dibujado ' + e.q80_dibujado;
          for (var k = 0; k < 3; k++) {
            var sn = datos.estudios.sin_datos[k], cn = datos.estudios.con_datos[k];
            if (!(Math.abs(cn.media - cn.obs) < Math.abs(sn.media - sn.obs))) return 'el estudio ' + cn.inicio + '-' + cn.fin + ' no se acerca';
          }
          return true;
        }),
      ];
    },
  });
})();
</script>
</body>
</html>

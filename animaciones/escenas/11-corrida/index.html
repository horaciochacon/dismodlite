<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>11 · Una corrida, de principio a fin · dismodlite</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<link rel="stylesheet" href="../../lib/escena.css">
<script src="../../lib/contrato.js"></script>
<script src="../../lib/movimiento.js"></script>
<script src="../../lib/dibujo.js"></script>
<script src="../../datos/11-corrida.js"></script>
</head>
<body>
<script>
// Escena 11: una corrida, de principio a fin. Guion: guion.md. Datos: datos/r/11-corrida.R (dl_correr() del ejemplo,
// corrida de prueba). El orden de los pasos es el exportado, que R comprobó contra el código de dl_correr().
(function () {
  'use strict';
  var D = DL.dib, M = DL.mov, P = D.paleta, E = M.EASE;
  var datos = DL_DATOS['11-corrida'];
  var ETAPAS = datos.etapas;
  var CG = datos.compuertas;

  // ---- Narración: cada línea dura al menos 0,3 s por palabra + 0,5 s ----
  var NARRACION = [
    [0.4, 3.6, 'Una corrida son tres comandos, en este orden.'],
    [3.9, 8.7, 'El primero crea la carpeta del proyecto: la configuración y las tablas del contrato.'],
    [9.0, 13.6, 'El segundo revisa cada tabla y dice cómo corregir lo que falle.'],
    [13.9, 18.3, 'El tercero lo corre todo; con la misma semilla, la misma corrida.'],
    [19.4, 24.3, 'Doce pasos, en el orden del código, cada uno con su escena.'],
    [24.6, 28.5, 'Primero, los insumos: las tablas armadas y con su hash.'],
    [28.8, 32.7, 'El ajuste nacional muestrea por sexo; la prueba usa cadenas cortas.'],
    [33.0, 37.2, 'La de producción: 1000 simulaciones y 4 cadenas de 50 000 iteraciones.'],
    [37.5, 42.6, 'Compuerta 1, tras el ajuste: R-hat < 1.01 y ESS ≥ 400 en cada parámetro.'],
    [42.9, 47.7, 'Esta prueba no pasa; rapido = TRUE la salta y el manifiesto lo declara.'],
    [48.0, 51.9, 'Un ajuste solo con el ancla: la referencia de las etiquetas.'],
    [52.2, 56.0, 'La cascada lleva lo nacional a los 25 departamentos.'],
    [56.3, 59.9, 'La validación compara la prevalencia ajustada con la del ancla.'],
    [60.2, 65.0, 'Compuerta 2: el error mediano no pasa de 0.05. Esta no se salta nunca.'],
    [65.3, 69.5, 'Los AVD: la prevalencia por la discapacidad de sus estados de salud.'],
    [69.8, 74.3, 'Las etiquetas dicen qué celdas movieron los datos y cuáles vienen del ancla.'],
    [74.6, 78.5, 'La sensibilidad repite el ajuste con otros $\\lambda$, $\\rho$ y $\\kappa$.'],
    [78.8, 83.0, 'El resumen: una fila por ubicación, sexo y banda, en cada medida.'],
    [83.3, 90.0, 'Todo queda en la carpeta de la corrida, con su manifiesto: se puede repetir.'],
  ];

  // Cuándo empieza cada paso (el marcador llega a su fila y entra su panel). Las claves son las exportadas.
  var T_PASO = {
    insumos: 24.6, ajuste: 28.8, compuerta1: 37.5, solo_prior: 48.0, cascada: 52.2, validacion: 56.3,
    compuerta2: 60.2, avd: 65.3, etiquetas: 69.8, sensibilidad: 74.6, resumen: 78.8, carpeta: 83.3,
  };
  var TP = ETAPAS.map(function (e) {
    if (T_PASO[e.clave] === undefined) throw new Error('El guion no tiene tiempo para el paso «' + e.clave + '».');
    return T_PASO[e.clave];
  });
  for (var q = 1; q < TP.length; q++) if (!(TP[q] > TP[q - 1])) throw new Error('Los tiempos no siguen el orden exportado.');
  function idx(clave) { for (var k = 0; k < ETAPAS.length; k++) if (ETAPAS[k].clave === clave) return k; return -1; }

  // ---- Retícula ----
  var COL = { x: 96, der: 800 };
  var PX = 880, PDER = 1824;            // el panel derecho
  var FILA0 = 312, FILA_H = 47;         // la lista de pasos
  function filaY(k) { return FILA0 + FILA_H * k; }
  var CAMARA = [18.5, 19.3];

  // Formatos.
  function pct(x, d) { return D.num(100 * x, d === undefined ? 2 : d) + ' %'; }
  function v(t, a, b, op) { return M.visible(t, a, b === undefined ? Infinity : b, op); }

  // Una marca de verificación (trazo, sin depender de un glifo) y una cruz.
  function check(x, y, s, op) {
    return D.trazo([[x, y], [x + 0.36 * s, y + 0.36 * s], [x + s, y - 0.42 * s]], { color: P.marca, grosor: 4, o: op });
  }
  function cruz(x, y, s, op) {
    return D.linea(x, y - s / 2, x + s, y + s / 2, { color: P.tinta, grosor: 4, o: op }) +
      D.linea(x, y + s / 2, x + s, y - s / 2, { color: P.tinta, grosor: 4, o: op });
  }

  // Una escala horizontal con marcas (sin texto auditado: son marcas de eje).
  function escala(x0, x1, y, dom, ticks, fmt) {
    function X(val) { return x0 + (val - dom[0]) / (dom[1] - dom[0]) * (x1 - x0); }
    return {
      x: X,
      svg: function (o) {
        var s = [D.linea(x0, y, x1, y, { color: P.guia, grosor: 2 })];
        ticks.forEach(function (tv) {
          s.push(D.linea(X(tv), y, X(tv), y + 8, { color: P.guia, grosor: 2 }));
          s.push(D.texto(X(tv), y + 34, fmt(tv), { tam: 22, color: P.suave, ancla: 'middle', fuente: 'mono' }));
        });
        return D.grupo(s, { o: o });
      },
    };
  }

  // El encabezado de un panel: el título (serif) y, debajo, la función o la regla.
  function encabezado(t, t0, t1, titulo, sub, op) {
    op = op || {};
    var s = [];
    if (op.formula) {
      s.push(D.parrafo(PX, 246, 900, titulo, { tam: 40, fuente: 'titulo', peso: 600, o: v(t, t0, t1), id: 'tit-' + op.id, alto: 60 }));
    } else {
      s.push(D.texto(PX, 288, titulo, { tam: 40, fuente: 'titulo', peso: 600, o: v(t, t0, t1), id: 'tit-' + op.id }));
    }
    s.push(D.texto(PX, 330, sub, { tam: 24, fuente: op.subSans ? 'texto' : 'mono', color: P.suave, o: v(t, t0 + 0.12, t1), id: 'sub-' + op.id }));
    return s.join('');
  }

  // ---- Tomas 1-4: los tres comandos ----
  var TARJETAS = [
    { y: 260, n: '1', f: datos.comandos[0], d: 'crea la carpeta: la configuración y las plantillas', t0: 3.9, t1: 8.7 },
    { y: 410, n: '2', f: datos.comandos[1], d: 'revisa todo antes de correr', t0: 9.0, t1: 13.6 },
    { y: 560, n: '3', f: datos.comandos[2], d: 'corre la causa, de principio a fin', t0: 13.9, t1: 18.3 },
  ];

  function tarjeta(t, k) {
    var c = TARJETAS[k];
    var activa = M.entra(t, c.t0, 0.3, E.entrarSuave) * (1 - M.entra(t, c.t1, 0.3, E.entrarSuave));
    if (k === 2) activa = M.entra(t, c.t0, 0.3, E.entrarSuave) * (1 - M.entra(t, CAMARA[1], 0.3, E.entrarSuave));
    // Las tarjetas 1 y 2 salen antes de la cámara; la 3 sube y queda como encabezado de la lista de pasos.
    var o = k < 2 ? M.sale(t, CAMARA[0] - 0.1) : 1;
    if (o <= 0) return '';
    var u = k === 2 ? E.camara(M.tramo(t, CAMARA[0], CAMARA[1])) : 0;
    var y = c.y + (236 - c.y) * u;
    var h = 120 + (60 - 120) * u;
    var s = [];
    s.push(D.rect(COL.x, y, COL.der - COL.x, h, { relleno: P.superficie, borde: P.rejilla, grosor: 2, radio: 12 }));
    if (activa > 0.01) s.push(D.rect(COL.x, y, COL.der - COL.x, h, { borde: P.marca, grosor: 3, radio: 12, o: activa }));
    var by = y + 50 - 8 * u;
    s.push(D.texto(COL.x + 32, by, c.n, { tam: 30, fuente: 'mono', peso: 500, color: P.marca, o: k === 2 ? M.sale(t, CAMARA[0] - 0.3) : 1 }));
    s.push(D.texto(COL.x + 76 - 48 * u, by + 2 * u, c.f, { tam: 32 - 2 * u, fuente: 'mono', peso: 500, id: 'cmd-' + c.n }));
    s.push(D.texto(COL.x + 76, y + 92, c.d, { tam: 24, color: P.suave, o: k === 2 ? M.sale(t, CAMARA[0] - 0.3) : 1, id: 'cmd-d-' + c.n }));
    return D.grupo(s, { o: o });
  }

  // El contrato de insumos (3.9-13.6) y su revisión (9.0-13.6).
  function contrato(t, c) {
    var t0 = 4.0, t1 = 13.6;
    if (t < t0 || t > t1 + 0.3) return;
    var s = [];
    s.push(D.texto(PX, 288, 'El contrato de insumos', { tam: 40, fuente: 'titulo', peso: 600, o: v(t, t0, t1), id: 'tit-contrato' }));
    s.push(D.texto(PX, 330, 'las tablas del proyecto de ejemplo, dl_ejemplo()', { tam: 24, color: P.suave, o: v(t, t0 + 0.12, t1), id: 'sub-contrato' }));
    var mostradas = [];
    datos.revision.tablas.forEach(function (tb, k) {
      var y = 392 + 46 * k;
      s.push(D.texto(PX + 40, y, tb.tabla, { tam: 26, fuente: 'mono', o: v(t, t0 + 0.3 + 0.12 * k, t1), id: 'tabla-' + k }));
      var tk = 9.3 + 0.12 * k;
      if (t >= tk) {
        var oc = v(t, tk, t1);
        s.push(check(PX, y - 10, 20, oc));
        var nota = tb.tabla === 'ancla' ? ' · descarga de GBD Results' : (tb.tabla === 'covariables' ? ' · descarga del GHDx' : '');
        var txt = D.miles(tb.filas) + ' filas' + nota;
        s.push(D.texto(PX + 330, y, txt, { tam: 24, color: P.suave, o: oc, id: 'filas-' + k }));
        if (oc > 0.5) mostradas.push(tb.filas);
      }
    });
    var r = datos.revision;
    var resumen = r.comprobaciones + ' comprobaciones: ' + r.errores + ' error(es) y ' + r.avisos + ' aviso(s)';
    s.push(D.texto(PX, 792, resumen, { tam: 28, o: v(t, 10.6, t1), id: 'revision' }));
    c.svg(s);
    c.dato('filas_mostradas', mostradas);
    if (t >= 10.6) c.dato('revision_texto', resumen);
  }

  // La llamada (13.9-18.3).
  var AVISO = 'Sus números no sirven para publicar';
  function llamada(t, c) {
    var t0 = 14.0, t1 = CAMARA[0];
    if (t < t0 || t > t1 + 0.3) return;
    var s = [];
    s.push(D.texto(PX, 288, 'La llamada', { tam: 40, fuente: 'titulo', peso: 600, o: v(t, t0, t1), id: 'tit-llamada' }));
    // dl_correr(dl_ejemplo(), causa = 9100, semilla = 1, rapido = TRUE), partida en dos líneas por la coma.
    var corte = datos.llamada.indexOf('semilla');
    var l1 = datos.llamada.slice(0, corte).trim(), l2 = datos.llamada.slice(corte);
    s.push(D.texto(PX, 392, l1, { tam: 30, fuente: 'mono', o: v(t, t0 + 0.12, t1), id: 'llamada-1' }));
    s.push(D.texto(PX + 10 * 18, 440, l2, { tam: 30, fuente: 'mono', o: v(t, t0 + 0.24, t1), id: 'llamada-2' }));
    s.push(D.texto(PX, 530, 'la corrida avisa:', { tam: 24, color: P.suave, o: v(t, 15.0, t1), id: 'avisa' }));
    s.push(D.texto(PX, 574, '«' + AVISO + '»', { tam: 28, o: v(t, 15.12, t1), id: 'aviso' }));
    c.svg(s);
    c.dato('llamada', l1 + ' ' + l2);
    c.dato('aviso_en_mensaje', datos.mensajes[0].indexOf(AVISO) >= 0);
  }

  // ---- La lista de pasos ----
  function pasoActivo(t) {
    var k = -1;
    for (var j = 0; j < TP.length; j++) if (t >= TP[j] - 0.25) k = j;
    return k;
  }

  function lista(t, c) {
    if (t < 19.3) return;
    var kact = pasoActivo(t);
    var s = [];
    s.push(D.texto(COL.der - 16, 276, ETAPAS.length + ' pasos', { tam: 24, color: P.suave, ancla: 'end', o: v(t, 19.6), id: 'n-pasos' }));
    // El marcador del paso activo: fondo blanco de la fila y barra de la marca; baja de fila en 0,5 s.
    if (kact >= 0) {
      var u = E.mover(M.tramo(t, TP[kact] - 0.25, TP[kact] + 0.25));
      var y0 = kact === 0 ? filaY(0) : filaY(kact - 1);
      var y = y0 + (filaY(kact) - y0) * u;
      var om = kact === 0 ? M.entra(t, TP[0] - 0.25, 0.4, E.entrarSuave) : 1;
      s.push(D.rect(COL.x + 8, y, COL.der - COL.x - 8, 40, { relleno: P.superficie, borde: P.rejilla, grosor: 1.5, radio: 8, o: om }));
      s.push(D.rect(COL.x, y + 3, 6, 34, { relleno: P.marca, radio: 3, o: om }));
    }
    var orden = [], filasY = {};
    var tenue = 1 - 0.5 * M.entra(t, 24.1, 0.3, E.entrarSuave);
    ETAPAS.forEach(function (e, k) {
      var y = filaY(k) + 28;
      var oe = v(t, 19.5 + 0.12 * k);
      if (oe <= 0) return;
      var brillo = (k === 0 || t >= TP[k] - 0.25) ? Math.max(tenue, 0.5 + 0.5 * M.entra(t, TP[k] - 0.25, 0.25, E.entrarSuave)) : tenue;
      if (k === 0) brillo = 1;
      var o = oe * brillo;
      var compuerta = e.clave.indexOf('compuerta') === 0;
      s.push(D.texto(COL.x + 28, y, String(k + 1).padStart(2, '0'), { tam: 22, fuente: 'mono', color: P.suave, o: o }));
      if (compuerta) {
        s.push(D.rect(COL.x + 76, y - 20, 5, 24, { relleno: P.marca, radio: 2, o: o }));
        s.push(D.rect(COL.x + 88, y - 20, 5, 24, { relleno: P.marca, radio: 2, o: o }));
        s.push(D.texto(COL.x + 108, y, e.funcion.replace(':', ' ·'), { tam: 24, peso: 600, color: P.marca, o: o, id: 'paso-' + k }));
      } else {
        s.push(D.texto(COL.x + 76, y, e.funcion, { tam: 24, fuente: 'mono', peso: k === kact ? 500 : 400, o: o, id: 'paso-' + k }));
      }
      // La ficha de la escena que explica el paso.
      var oc = v(t, 21.4 + 0.12 * k) * brillo;
      var etiqueta = 'esc. ' + e.escena.replace('-', '–').replace(', ', '·');
      var w = etiqueta.length * 13.2 + 20;
      s.push(D.rect(COL.der - 12 - w, y - 24, w, 32, { borde: P.guia, grosor: 1.5, radio: 16, o: oc }));
      s.push(D.texto(COL.der - 22, y - 1, etiqueta, { tam: 22, fuente: 'mono', color: P.suave, ancla: 'end', o: oc, id: 'esc-' + k }));
      orden.push(e.clave);
      filasY[e.clave] = y;
    });
    c.svg(s);
    c.dato('orden', orden.join(','));
    c.dato('filas_y', filasY);
    c.dato('activa', kact >= 0 ? ETAPAS[kact].clave : null);
  }

  // ---- Los paneles de cada paso ----
  function fin(clave) {
    var k = idx(clave);
    if (clave === 'validacion') return TP[idx('compuerta2') + 1] - 0.3;
    return k + 1 < TP.length ? TP[k + 1] - 0.3 : Infinity;
  }

  function pInsumos(t, c) {
    var t0 = T_PASO.insumos + 0.1, t1 = fin('insumos');
    if (t < t0 || t > t1 + 0.3) return;
    var s = [encabezado(t, t0, t1, 'Los insumos', 'dl_insumos()', { id: 'insumos' })];
    s.push(D.texto(PX, 410, 'hash de los insumos', { tam: 26, color: P.suave, o: v(t, t0 + 0.3, t1), id: 'hash-et' }));
    var hash = datos.bundle_hash.slice(0, 12) + '…';
    s.push(D.texto(PX, 466, hash, { tam: 40, fuente: 'mono', o: v(t, t0 + 0.42, t1), id: 'hash' }));
    var fuera = datos.datos_fuera + ' filas de datos, fuera del ajuste';
    s.push(D.texto(PX, 560, fuera, { tam: 28, o: v(t, t0 + 0.6, t1), id: 'fuera' }));
    s.push(D.texto(PX, 600, 'datos_en_ajuste: vacío', { tam: 24, fuente: 'mono', color: P.suave, o: v(t, t0 + 0.72, t1), id: 'fuera-2' }));
    c.svg(s);
    c.dato('hash', hash);
  }

  // Las cadenas a escala: 50 000 iteraciones = 860 px; calentamiento en guía, muestreo en la marca.
  var POR_ITER = 860 / datos.produccion.iter;
  function cadenas(t, y, o, u, op) {
    var s = [];
    for (var k = 0; k < op.chains; k++) {
      var yy = y + 20 * k;
      var wc = op.warmup * POR_ITER * u, wm = (op.iter - op.warmup) * POR_ITER * u;
      s.push(D.rect(PX, yy, wc, 14, { relleno: P.guia, o: o }));
      s.push(D.rect(PX + wc, yy, wm, 14, { relleno: P.marca, o: o }));
    }
    return s.join('');
  }
  function pAjuste(t, c) {
    var t0 = T_PASO.ajuste + 0.1, t1 = fin('ajuste');
    if (t < t0 || t > t1 + 0.3) return;
    var pr = datos.prueba, pd = datos.produccion;
    var s = [encabezado(t, t0, t1, 'El ajuste nacional', 'dl_ajustar() · por sexo', { id: 'ajuste' })];
    var ol = v(t, t0 + 0.3, t1);
    s.push(D.rect(PX, 384, 26, 14, { relleno: P.guia, o: ol }));
    s.push(D.texto(PX + 36, 398, 'calentamiento', { tam: 22, color: P.suave, o: ol, id: 'ley-cal' }));
    s.push(D.rect(PX + 220, 384, 26, 14, { relleno: P.marca, o: ol }));
    s.push(D.texto(PX + 256, 398, 'muestreo', { tam: 22, color: P.suave, o: ol, id: 'ley-mue' }));
    // La prueba.
    var o1 = v(t, t0 + 0.45, t1);
    var txt1 = pr.chains + ' cadenas × ' + pr.iter + ' iteraciones · ' + pr.draws + ' simulaciones';
    s.push(D.texto(PX, 460, 'rapido = TRUE', { tam: 26, fuente: 'mono', o: o1, id: 'aj-prueba' }));
    s.push(D.texto(PDER, 460, txt1, { tam: 24, color: P.suave, ancla: 'end', o: v(t, t0 + 0.57, t1), id: 'aj-prueba-d' }));
    s.push(cadenas(t, 478, o1, 1, pr));
    // La producción: sus barras crecen en 1,2 s (el movimiento principal de la toma).
    var tp = 33.1;
    var o2 = v(t, tp, t1);
    var txt2 = pd.chains + ' cadenas × ' + D.miles(pd.iter) + ' iteraciones · ' + pd.draws + ' simulaciones';
    s.push(D.texto(PX, 572, 'por defecto (producción)', { tam: 26, fuente: 'mono', o: o2, id: 'aj-prod' }));
    s.push(D.texto(PDER, 572, txt2, { tam: 24, color: P.suave, ancla: 'end', o: v(t, tp + 0.3, t1), id: 'aj-prod-d' }));
    var ub = E.mover(M.tramo(t, tp + 0.1, tp + 1.3));
    if (t >= tp) s.push(cadenas(t, 590, o2, ub, pd));
    var esc = escala(PX, PX + 860, 690, [0, pd.iter], [0, 10000, 20000, 30000, 40000, 50000], function (x) { return D.miles(x); });
    s.push(esc.svg(v(t, t0 + 0.45, t1)));
    s.push(D.texto(PX + 860, 760, 'iteraciones por cadena', { tam: 22, color: P.suave, ancla: 'end', o: v(t, t0 + 0.69, t1), id: 'aj-eje' }));
    c.svg(s);
    c.dato('txt_prueba', txt1);
    c.dato('txt_produccion', txt2);
    c.dato('px_prueba', pr.iter * POR_ITER);
    c.dato('px_produccion', pd.iter * POR_ITER * ub);
    c.dato('px_eje', esc.x(pd.iter) - esc.x(0));
  }

  function pCompuerta1(t, c) {
    var t0 = T_PASO.compuerta1 + 0.1, t1 = fin('compuerta1');
    if (t < t0 || t > t1 + 0.3) return;
    var s = [encabezado(t, t0, t1, 'Compuerta 1 · convergencia', 'R-hat < ' + CG.rhat_limite + ' y ESS ≥ ' + CG.ess_minimo + ' en los ' + CG.parametros + ' parámetros', { id: 'c1', subSans: true })];
    // R-hat: del límite al máximo de la corrida.
    var R = escala(PX + 20, PX + 820, 470, [1, 2.5], [1, 1.5, 2, 2.5], function (x) { return D.num(x, 1); });
    var oR = v(t, t0 + 0.3, t1);

  // La cascada: 25 departamentos (prevalencia de mujeres de 70 a 74) como puntos p, apilados sin choques.
  var CEL = datos.celdas.prevalencia;
  var CAS = escala(PX + 20, PX + 900, 640, [0.048, 0.070], [0.05, 0.055, 0.06, 0.065, 0.07], function (x) { return D.num(100 * x, 1) + ' %'; });
  var ENJAMBRE = (function () {
    var puestos = [], niveles = [0, -24, 24, -48, 48, -72, 72];
    return CEL.subnacional.map(function (val) {
      var x = CAS.x(val);
      for (var n = 0; n < niveles.length; n++) {
        var libre = puestos.every(function (p) { return p.dy !== niveles[n] || Math.abs(p.x - x) >= 22; });
        if (libre) { var pu = { x: x, dy: niveles[n] }; puestos.push(pu); return pu; }
      }
      throw new Error('el enjambre no cabe');
    });
  })();
  function pCascada(t, c) {

  function pSensibilidad(t, c) {

      var manifiesto = a.nombre === 'manifest.yaml';
      s.push(D.linea(PX + 12, y - 52 + (k === 0 ? 12 : 0), PX + 12, y - 8, { color: P.guia, grosor: 2, o: o }));
      s.push(D.linea(PX + 12, y - 8, PX + 30, y - 8, { color: P.guia, grosor: 2, o: o }));
      if (manifiesto) s.push(D.rect(PX + 34, y - 30, 236, 42, { borde: P.marca, grosor: 2.5, radio: 6, o: o }));
      s.push(D.texto(PX + 44, y, a.nombre, { tam: 24, fuente: 'mono', o: o, id: 'car-a' + k }));
      if (!manifiesto) s.push(D.texto(PX + 260, y, a.archivos + (a.archivos === 1 ? ' archivo' : ' archivos'), { tam: 22, color: P.suave, o: o, id: 'car-n' + k }));
      if (o > 0) total += manifiesto ? 1 : a.archivos;
    });
    // Lo que declara el manifiesto: claves reales de manifest.yaml.
    var MX = 1420, om = v(t, t0 + 1.3);
    s.push(D.rect(MX - 20, 420, PDER - MX + 20, 290, { relleno: P.superficie, borde: P.rejilla, grosor: 2, radio: 12, o: om }));
    var campos = [
      'bundle_hash: ' + datos.bundle_hash.slice(0, 12) + '…',
      'por_defecto: ' + datos.por_defecto.length + ' claves',
      'gates.force: ' + String(datos.compuertas.force),
      'limitaciones: ' + datos.limitaciones.length,
      'decisiones: ' + [].concat(datos.decisiones).length,
    ];
    s.push(D.texto(MX, 462, 'manifest.yaml', { tam: 24, fuente: 'mono', peso: 500, o: om, id: 'car-man' }));
    campos.forEach(function (cp, k) {
      s.push(D.texto(MX, 508 + 42 * k, cp, { tam: 22, fuente: 'mono', color: k === 2 ? P.tinta : P.suave, o: v(t, t0 + 1.45 + 0.12 * k), id: 'car-c' + k }));
    });
    s.push(D.texto(PX, 790, 'inputs/contrato/ es un proyecto: con dl_proyecto() se repite la corrida.', { tam: 26, o: v(t, 85.6), id: 'car-rep' }));
    c.svg(s);
    c.dato('archivos_dibujados', total);
    c.dato('campos', campos);
  }

  function dibujar(t, c) {
    c.svg(D.cabecera(11, 11, 'Una corrida, de principio a fin', { funcion: 'dl_correr()' }));
    for (var k = 0; k < 3; k++) c.svg(tarjeta(t, k));
    contrato(t, c);
    llamada(t, c);
    lista(t, c);
    pInsumos(t, c); pAjuste(t, c); pCompuerta1(t, c); pSoloPrior(t, c); pCascada(t, c);
    pValidacion(t, c); pAvd(t, c); pEtiquetas(t, c); pSensibilidad(t, c); pResumen(t, c); pCarpeta(t, c);
    c.svg(D.rotulo(t, NARRACION));
    c.svg(D.pie(datos.fuente));
  }

  var MARCAS = {
    comandos: 2.0, contrato: 8.0, revision: 13.0, llamada: 17.5, camara: 18.9, pasos: 24.0,
    insumos: 27.8, ajuste: 31.8, produccion: 36.5, compuerta1: 41.5, salta: 46.8, solo_prior: 51.0,
    cascada: 55.4, validacion: 59.4, compuerta2: 64.0, avd: 68.8, etiquetas: 73.6, sensibilidad: 77.8,
    resumen: 82.4, carpeta: 87.0, final: 89.9,
  };

  DL.escena({
    id: '11-corrida',
    titulo: 'Una corrida, de principio a fin',
    duracion: 90, fps: 30,
    marcas: MARCAS,
    camaras: [CAMARA],
    dibujar: dibujar,
    auditoria: function (A) {
      var claves = ETAPAS.map(function (e) { return e.clave; });
      var lista = [
        A.en('pasos', 'las filas dibujadas bajan en el orden del código de .dl_correr_proyecto() y en el de los mensajes de la corrida', function (e) {
          // Independiente del dibujo: la posición de cada llamada en el código y el orden de los mensajes que emitió la corrida.
          var porCodigo = ETAPAS.slice().sort(function (a, b) { return a.posicion_codigo - b.posicion_codigo; });
          for (var k = 1; k < porCodigo.length; k++) {
            var a = e.filas_y[porCodigo[k - 1].clave], b = e.filas_y[porCodigo[k].clave];
            if (!(b > a)) return porCodigo[k].clave + ' se dibuja arriba de ' + porCodigo[k - 1].clave + ', y en el código va después';
          }
          var conMensaje = ETAPAS.filter(function (x) { return x.orden_mensaje !== undefined; })
            .sort(function (a, b) { return a.orden_mensaje - b.orden_mensaje; });
          for (var j = 1; j < conMensaje.length; j++) {
            if (!(e.filas_y[conMensaje[j].clave] > e.filas_y[conMensaje[j - 1].clave])) return 'la corrida anunció ' + conMensaje[j].clave + ' después de ' + conMensaje[j - 1].clave;
          }
          return Object.keys(e.filas_y).length === ETAPAS.length || 'faltan filas';
        }),
        A.en('revision', 'las tablas y sus filas son las que leyó dl_revisar_proyecto(), sin errores', function (e) {
          var f = datos.revision.tablas.map(function (x) { return x.filas; });
          if (JSON.stringify(e.filas_mostradas) !== JSON.stringify(f)) return 'mostradas ' + e.filas_mostradas + ', revisión ' + f;
          if (datos.revision.errores !== 0) return 'la revisión tiene errores';
          return datos.revision.tablas.every(function (x) { return x.estado === 'ok'; }) || 'una tabla no está en orden';
        }),
        A.en('llamada', 'la llamada es la de la corrida y el aviso está en el primer mensaje que emitió', function (e) {
          if (e.llamada.replace(/\s+/g, ' ') !== datos.llamada) return 'llamada ' + e.llamada;
          return e.aviso_en_mensaje === true || 'el aviso no está en el mensaje';
        }),
        A.en('produccion', 'las barras están a escala del eje de iteraciones; la prueba es la del manifiesto y la producción, la de dl_opciones_mcmc()', function (e) {
          var pr = datos.prueba, pd = datos.produccion;
          if (!(pd.draws === 1000 && pd.chains === 4 && pd.iter === 50000)) return 'producción: ' + JSON.stringify(pd);
          if (!A.cerca(e.px_produccion, e.px_eje, 1e-9)) return 'la barra de producción mide ' + e.px_produccion + ' px y el eje ' + e.px_eje;
          var msg = datos.mensajes.filter(function (m) { return m.indexOf('ajuste nacional') === 0; })[0] || '';
          if (msg.indexOf(pr.chains + ' cadena(s) de ' + pr.iter + ' iteraciones') < 0) return 'el mensaje del ajuste dice otra cosa: ' + msg;
          return A.cerca(e.px_prueba / e.px_eje, pr.iter / pd.iter, 1e-12) || 'la barra de la prueba no está a escala';
        }),
        A.en('salta', 'el dibujo de la compuerta 1 dice lo que dicen los números: el punto de R-hat a la derecha del límite y el de ESS a la izquierda del mínimo; «no pasa»', function (e) {
          if (!A.cerca(CG.rhat_max, CG.rhat_max_csv, 1e-5) || !A.cerca(CG.ess_min, CG.ess_min_csv, 0.01)) return 'manifiesto y diagnostics/mcmc.csv no coinciden';
          if (e.rhat_texto !== D.num(CG.rhat_max_csv, 2) || e.ess_texto !== D.num(CG.ess_min_csv, 1)) return e.rhat_texto + ' ' + e.ess_texto;
          var falla = CG.rhat_max_csv >= CG.rhat_limite || CG.ess_min_csv < CG.ess_minimo;
          if ((e.x_rhat > e.x_rlim) !== (CG.rhat_max_csv >= CG.rhat_limite)) return 'el punto de R-hat está del lado equivocado del límite';
          if ((e.x_ess < e.x_elim) !== (CG.ess_min_csv < CG.ess_minimo)) return 'el punto de ESS está del lado equivocado del mínimo';
          if (!falla) return 'la prueba sí pasa: el veredicto debe cambiar';
          return (e.no_pasa === true && CG.force === true) || 'falta el veredicto o gates.force';
        }),
        A.en('cascada', 'un punto por cada ubicación subnacional de la tabla ubicaciones, y la línea nacional dentro de su abanico', function (e) {
          var sub = datos.revision.tablas.filter(function (x) { return x.tabla === 'ubicaciones'; })[0].filas - 1;
          if (e.departamentos_dibujados !== sub || sub !== datos.cascada.departamentos) return e.departamentos_dibujados + ' puntos, ' + sub + ' ubicaciones subnacionales';
          var mn = Math.min.apply(null, e.x_puntos), mx = Math.max.apply(null, e.x_puntos);
          return (e.x_nacional > mn && e.x_nacional < mx) || 'la línea nacional cae fuera de los departamentos';
        }),
        A.en('compuerta2', 'el punto del error del ancla queda a la izquierda del máximo exactamente cuando el error no lo pasa; «pasa»', function (e) {
          if (e.err_texto !== D.num(CG.err_ancla, 3)) return e.err_texto;
          if ((e.x_err <= e.x_max) !== (CG.err_ancla <= CG.err_maximo)) return 'el punto está del lado equivocado del máximo';
          return (CG.err_ancla <= CG.err_maximo && e.pasa === true) || 'no pasa';
        }),
        A.en('etiquetas', 'un cuadrito por celda: ubicaciones de la revisión x sexos x bandas = las filas de la tabla de etiquetas', function (e) {
          var CP = datos.celdas.prevalencia, EQ = datos.etiquetas;
          var ub = datos.revision.tablas.filter(function (x) { return x.tabla === 'ubicaciones'; })[0].filas;
          var suma = Object.keys(EQ.tabla).reduce(function (a, k) { return a + EQ.tabla[k]; }, 0);
          if (e.cuadritos !== EQ.celdas) return e.cuadritos + ' cuadritos de ' + EQ.celdas;
          return (suma === EQ.celdas && ub * CP.sexos * CP.bandas === EQ.celdas) || 'celdas inconsistentes';
        }),
        A.en('sensibilidad', 'la grilla dibujada (de diagnostics/sensibilidad.csv) es la que declara la configuración de la corrida', function (e) {
          var pd = {};
          datos.por_defecto.forEach(function (k, j) { pd[k] = datos.por_defecto_valores[j]; });
          var aLista = function (x) { return JSON.parse(x); };
          if (JSON.stringify(e.rho_dibujados) !== JSON.stringify(aLista(pd['sensibilidad.correlacion_edad']))) return 'ρ ' + e.rho_dibujados;
          if (JSON.stringify(e.kappa_dibujados) !== JSON.stringify(aLista(pd['sensibilidad.kappa']))) return 'κ ' + e.kappa_dibujados;
          var G = datos.sensibilidad;
          return e.sens_dibujados === G.lambda.length * G.rho.length + ' ajustes y ' + G.kappa.length + ' cascadas' || e.sens_dibujados;
        }),
        A.en('resumen', 'las filas de cada tabla de celdas son las del manifiesto y valen ubicaciones x sexos x bandas', function (e) {
          var f = datos.files.map(function (x) { return x.rows; });
          if (JSON.stringify(e.res_filas) !== JSON.stringify(f)) return 'filas ' + e.res_filas;
          var CP = datos.celdas.prevalencia;
          if (!f.every(function (n) { return n === CP.ubicaciones * CP.sexos * CP.bandas; })) return 'filas distintas de ubicaciones x sexos x bandas';
          return (CP.lower < CP.val && CP.val < CP.upper) || 'la media cae fuera de su intervalo';
        }),
        A.en('carpeta', 'el árbol dibujado suma todos los archivos de la corrida y el hash es el del manifiesto', function (e) {
          if (e.archivos_dibujados !== datos.n_archivos) return e.archivos_dibujados + ' de ' + datos.n_archivos;
          return e.campos[0].indexOf(datos.bundle_hash.slice(0, 12)) >= 0 || 'hash';
        }),
      ];
      ['insumos', 'ajuste', 'compuerta1', 'solo_prior', 'cascada', 'validacion', 'compuerta2', 'avd', 'etiquetas', 'sensibilidad', 'resumen', 'carpeta'].forEach(function (cl) {
        lista.push(A.en(cl, 'la fila activa en «' + cl + '» es la de ese paso', function (e) {
          return e.activa === cl || 'activa: ' + e.activa;
        }));
      });
      return lista;
    },
  });
})();
</script>
</body>
</html>
